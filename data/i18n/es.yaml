# Catálogo de textos en español — idioma por defecto (Requisito 22)
#
# Todo texto visible se resuelve por clave de catálogo, incluidos los nombres y
# descripciones declarados en los ficheros de contenido (Requisito 22.1, 22.3).
# Si una clave declarada en los datos no existe aquí, el Validador_De_Datos
# impide el inicio de la partida (Requisito 22.4).

locale: "es"

number_format:
  decimal_separator: ","
  thousands_separator: "."

plural_rules: "spanish"        # n == 1 ⇒ singular; en otro caso plural

strings:
  # ======================================================== Terrenos ==
  "terrain.prado.name": "Prado"
  "terrain.prado.desc": "Tierra fértil para cultivos y ganado. El mejor sitio para empezar."
  "terrain.tundra.name": "Tundra"
  "terrain.tundra.desc": "Suelo frío y pobre: los cultivos rinden la mitad."
  "terrain.desierto.name": "Desierto"
  "terrain.desierto.desc": "Terreno hostil. No admite plantaciones y castiga a las casas."
  "terrain.no_fertil.name": "Terreno no fértil"
  "terrain.no_fertil.desc": "Roca desnuda. Nada crece aquí, pero minas y fábricas rinden más."
  "terrain.oceano.name": "Océano"
  "terrain.oceano.desc": "Solo admite construcciones navales. Esconde peces, ballenas y piratas."

  # ================================================ Acciones genéricas ==
  "action.recolectar.name": "Recolectar"
  "action.talar.name": "Talar"

  # ======================================================== Elementos ==
  "element.montana.name": "Montaña"
  "element.montana.desc": "Roca impracticable. Solo admite una mina y no se puede recolectar."
  "element.bosque.name": "Bosque"
  "element.bosque.desc": "Materia prima. Se puede talar de una vez o explotar con un aserradero adyacente."
  "element.vaca.name": "Rebaño de vacas"
  "element.vaca.desc": "Comida abundante. Se puede recolectar una vez o explotar con una granja."
  "element.gallinas.name": "Corral de gallinas"
  "element.gallinas.desc": "Poca comida, pero constante. Se puede recolectar o explotar con una granja."
  "element.cabras.name": "Rebaño de cabras"
  "element.cabras.desc": "El único animal doméstico que aguanta la tundra, aunque rinde menos allí."
  "element.cerdos.name": "Piara de cerdos"
  "element.cerdos.desc": "Comida y algún material. Se puede recolectar o explotar con una granja."
  "element.peces.name": "Banco de peces"
  "element.peces.desc": "Comida del mar. Requiere Navegación costera para aprovecharlo."
  "element.ballenas.name": "Ballenas"
  "element.ballenas.desc": "Una captura enorme. Requiere Navegación costera."
  "element.poblado.name": "Poblado"
  "element.poblado.desc": "Gente con sus propios acertijos. Plantea un puzzle de efecto permanente."
  "element.misterio.name": "Misterio"
  "element.misterio.desc": "Un enigma en el paisaje. Plantea un puzzle de efecto inmediato."
  "element.lobos.name": "Manada de lobos"
  "element.lobos.desc": "Animales peligrosos. Reducen la población cercana y reaparecen si dejas la casilla vacía."
  "element.jabalies.name": "Piara de jabalíes"
  "element.jabalies.desc": "Arrasan los alrededores del prado. Reducen la población cercana."
  "element.leones.name": "Leones del desierto"
  "element.leones.desc": "Cazadores del desierto. Reducen la población cercana."
  "element.osos.name": "Osos"
  "element.osos.desc": "La amenaza animal más dura. Reducen bastante la población cercana."
  "element.barbaros.name": "Campamento bárbaro"
  "element.barbaros.desc": "Amenaza humana. Drena la producción cercana, se expande y sube de nivel."
  "element.piratas.name": "Guarida pirata"
  "element.piratas.desc": "Amenaza humana del mar. Drena la producción cercana y se expande por el océano."

