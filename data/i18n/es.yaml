  # ================================================ Puzzles: poblados ==
  "puzzle.poblado_guardianes.name": "Los Guardianes del Vado"
  "puzzle.poblado_guardianes.text": >
    Dos guardianes vigilan el paso del río. Uno dice siempre la verdad y el otro
    miente siempre, pero no sabes quién es quién. Solo puedes hacer una pregunta
    a uno de ellos para descubrir qué sendero cruza el vado.
  "puzzle.poblado_guardianes.option.1.text": "¿Cuál es el sendero correcto?"
  "puzzle.poblado_guardianes.option.2.text": "Si le preguntara al otro guardián cuál es el sendero correcto, ¿qué me diría?"
  "puzzle.poblado_guardianes.option.3.text": "¿Eres tú el que dice la verdad?"
  "puzzle.poblado_guardianes.success": "Los guardianes se suman a tus filas: +1 de fuerza en todos los combates."
  "puzzle.poblado_guardianes.failure": "Los guardianes te cierran el paso: -1 de producción en los hexágonos adyacentes."

  "puzzle.poblado_tejedores.name": "El Gremio de Tejedores"
  "puzzle.poblado_tejedores.text": >
    Tres tejedores hacen 3 mantas en 3 días. ¿Cuántos tejedores hacen falta para
    tejer 9 mantas en 9 días?
  "puzzle.poblado_tejedores.option.1.text": "3 tejedores"
  "puzzle.poblado_tejedores.option.2.text": "6 tejedores"
  "puzzle.poblado_tejedores.option.3.text": "9 tejedores"
  "puzzle.poblado_tejedores.option.4.text": "27 tejedores"
  "puzzle.poblado_tejedores.success": "El gremio abre una ruta comercial: +2 de oro por día."
  "puzzle.poblado_tejedores.failure": "Hay que mantener al gremio: -1 de comida por día."

  "puzzle.poblado_pozo_seco.name": "El Pozo Seco"
  "puzzle.poblado_pozo_seco.text": >
    Los aldeanos tienen dos cántaros, uno de 5 litros y otro de 3, y necesitan
    medir exactamente 4 litros para reabrir el pozo. ¿Qué secuencia de trasvases
    lo consigue?
  "puzzle.poblado_pozo_seco.option.1.text": "Llenar el de 3 y volcarlo dos veces en el de 5."
  "puzzle.poblado_pozo_seco.option.2.text": >
    Llenar el de 5, volcarlo en el de 3, vaciar el de 3, pasar los 2 litros
    restantes al de 3, llenar otra vez el de 5 y completar el de 3: quedan 4
    litros en el grande.
  "puzzle.poblado_pozo_seco.option.3.text": "Llenar los dos cántaros y vaciar el de 3 en el pozo."
  "puzzle.poblado_pozo_seco.option.4.text": "Llenar el de 5 y verter la mitad a ojo."
  "puzzle.poblado_pozo_seco.success": "Los aldeanos comparten el acuífero: las plantaciones adyacentes producen +1 de comida."
  "puzzle.poblado_pozo_seco.failure": "El agua se contamina: la probabilidad diaria de enfermedad sube un 50 %."

  "puzzle.poblado_senderos.name": "Los Senderos Contados"
  "puzzle.poblado_senderos.text": >
    Los rastreadores del poblado marcan los senderos con una sucesión grabada en
    piedra: {secuencia}. ¿Qué número sigue?
  "puzzle.poblado_senderos.option.text": "{valor}"
  "puzzle.poblado_senderos.success": "Los rastreadores te guían: explorar cuesta un 20 % menos de población."
  "puzzle.poblado_senderos.failure": "Los rastreadores te dan mal las señas: explorar cuesta un 25 % más de población."

  # =============================================== Puzzles: misterios ==
  "puzzle.misterio_monolito.name": "El Monolito de las Tres Cifras"
  "puzzle.misterio_monolito.text": >
    Un monolito guarda un número de {digitos} cifras. Estas son las pistas
    grabadas en su base:
  "puzzle.misterio_monolito.hint": "{numero}: {bien_colocadas} bien colocadas, {mal_colocadas} correctas pero mal colocadas."
  "puzzle.misterio_monolito.option.text": "{valor}"
  "puzzle.misterio_monolito.success": "Descifras el monolito: +40 de ciencia."
  "puzzle.misterio_monolito.failure": "El monolito se derrumba: -3 de población."

  "puzzle.misterio_balanza.name": "La Balanza del Mercader"
  "puzzle.misterio_balanza.text": >
    Ocho monedas iguales, una de ellas falsa y más ligera. ¿Cuál es el número
    mínimo de pesadas en una balanza de dos platos que garantiza encontrarla?
  "puzzle.misterio_balanza.option.1.text": "1 pesada"
  "puzzle.misterio_balanza.option.2.text": "2 pesadas"
  "puzzle.misterio_balanza.option.3.text": "3 pesadas"
  "puzzle.misterio_balanza.option.4.text": "7 pesadas"
  "puzzle.misterio_balanza.success": "El mercader paga su deuda: +50 de oro."
  "puzzle.misterio_balanza.failure": "El mercader te engaña: -20 de materiales."

  "puzzle.misterio_mapa_roto.name": "El Mapa Roto del Cartógrafo"
  "puzzle.misterio_mapa_roto.text": >
    Un mapa roto muestra un patrón incompleto de hexágonos. ¿Qué pieza falta
    para completarlo?
  "puzzle.misterio_mapa_roto.option.text": "Pieza {valor}"
  "puzzle.misterio_mapa_roto.success": "Reconstruyes el mapa: se intuyen los 6 hexágonos de alrededor."
  "puzzle.misterio_mapa_roto.failure": "El mapa se deshace entre tus manos: -1 de población."

  "puzzle.misterio_granero.name": "El Granero Sellado"
  "puzzle.misterio_granero.text": >
    Una sucesión grabada en la puerta del granero: 2, 6, 12, 20, 30, ... ¿Qué
    número sigue?
  "puzzle.misterio_granero.option.1.text": "36"
  "puzzle.misterio_granero.option.2.text": "40"
  "puzzle.misterio_granero.option.3.text": "42"
  "puzzle.misterio_granero.option.4.text": "44"
  "puzzle.misterio_granero.success": "El granero se abre: +60 de comida."
  "puzzle.misterio_granero.failure": "El grano está podrido: -15 de comida."

